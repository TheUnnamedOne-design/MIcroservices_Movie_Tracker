spring.application.name=Authentication


# Import local environment variables
spring.config.import=optional:file:.env[.properties]

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=adityalocal
spring.datasource.password=${AUTH_DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000


# HTTPS configuration
server.port=8081
server.ssl.enabled=true
server.ssl.key-store=file:./keystore/localhost.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-alias=localhost